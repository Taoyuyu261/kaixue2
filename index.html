    <style>
        :root {
            --warm-bg: #FFF8F0;
            --warm-card: #FFFFFF;
            --warm-primary: #E66A3C;
            --warm-primary-light: #FDECE5;
            --warm-secondary: #F5A623;
            --warm-text: #4A3B2A;
            --warm-text-light: #8C7B66;
            --warm-border: #EAD4C3;
            --warm-success: #7CB342;
            --warm-warning: #F5A623;
            --warm-danger: #C65D57;
            --shadow: 0 2px 8px rgba(74, 59, 42, 0.08);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--warm-bg);
            color: var(--warm-text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #FFF5EE 0%, #FFE8D9 100%);
            border-right: 1px solid var(--warm-border);

        let children = [];
        let currentView = 'form';
        let currentChildId = null;
        let submitDate = formatDate();

        function init() {
            loadFromStorage();
            if (children.length === 0) addChild();
            renderChildList();
            switchView('form');
            bindEvents();
        }

        function createId() { return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }

        // 为每个孩子生成稳定但唯一的随机种子，保证同个孩子多次生成内容一致，不同孩子内容不同
        function childSeed(child) {
            const info = child.form.info;
            const dims = child.form.dimensions.map(d => d.code + d.firstHalf + d.secondHalf).join('');
            const str = (info.name || '') + (info.className || '') + (info.gender || '') + dims;
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const chr = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + chr;
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function seededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return function () {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        function shuffleWithSeed(arr, rand) {
            const result = arr.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function randomPick(arr, rand) {
            return arr[Math.floor(rand() * arr.length)];
        }

        function createEmptyForm() {
            return {
                info: { name: '', gender: '', className: '' },
                dimensions: dimensions.map(d => ({ code: d.code, firstHalf: '', secondHalf: '', note: '' })),
                narrative: { moments: '', focus: '', likes: '', goals: '' }
            };
        }

        function addChild() {
            const id = createId();
            children.push({ id, form: createEmptyForm() });
            currentChildId = id;
            renderChildList();
            if (currentView !== 'form') switchView('form');
            else renderForm(document.getElementById('mainContent'));
            showToast('已添加新孩子，请重新填写信息', 'success');
        }

        function removeChild(id, event) {
            event.stopPropagation();
            if (!confirm('确定删除这个孩子吗？')) return;
            children = children.filter(c => c.id !== id);
            saveToStorage();
            if (children.length === 0) addChild();
            else if (currentChildId === id) currentChildId = children[0].id;
            renderChildList();
            switchView(currentView);
        }

        function getCurrentChild() { return children.find(c => c.id === currentChildId); }

        function completionStatus(child) {
            const info = child.form.info;
            if (!info.name.trim() || !info.className.trim()) return 'empty';
            const dims = child.form.dimensions;
            const filled = dims.filter(d => d.firstHalf && d.secondHalf).length;
            if (filled === 0) return 'empty';
            if (filled === dims.length) return 'done';
            return 'partial';
        }

        function renderChildList() {
            const list = document.getElementById('childList');
            list.innerHTML = children.map(child => {
                const status = completionStatus(child);
                const cls = child.id === currentChildId ? 'active' : '';
                const statusCls = status === 'done' ? 'done' : status === 'partial' ? 'partial' : '';
                const displayName = child.form.info.name.trim() || '未命名孩子';
                return `<div class="child-item ${cls}" data-id="${child.id}">
                    <span>${escapeHtml(displayName)}</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="status ${statusCls}"></span>
                        <button class="del-btn" data-id="${child.id}">删除</button>
                    </div>
                </div>`;
            }).join('');

            list.querySelectorAll('.child-item').forEach(item => {
                item.addEventListener('click', () => { collectCurrentForm(false); currentChildId = item.dataset.id; renderChildList(); switchView(currentView); });
            });
            list.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', e => removeChild(btn.dataset.id, e));
            });
        }

        function bindEvents() {
            document.querySelectorAll('.nav-item').forEach(nav => {
                nav.addEventListener('click', () => {
                    if (!collectCurrentForm(false)) return;
                    switchView(nav.dataset.view);
                });
            });
            document.querySelector('.add-child-btn').addEventListener('click', addChild);
            document.getElementById('addChildTop').addEventListener('click', () => {
                collectCurrentForm(false);
                addChild();
            });
            document.getElementById('saveCurrent').addEventListener('click', () => {
                if (collectCurrentForm(true)) showToast('已保存当前孩子的填写内容', 'success');
            });
            document.getElementById('resetAll').addEventListener('click', () => {
                if (!confirm('确定清空所有已填写的数据吗？此操作不可恢复。')) return;
                children = [];
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(STORAGE_DATE_KEY);
                addChild();
                showToast('已重置全部数据', 'success');
            });
            window.addEventListener('beforeunload', () => collectCurrentForm(false));
        }

        function switchView(view) {
            collectCurrentForm(false);
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
            document.getElementById('pageTitle').textContent = view === 'form' ? '填写调查表' : view === 'preview' ? '信件预览' : '批量生成';
            const content = document.getElementById('mainContent');
            content.innerHTML = '';
            if (view === 'form') renderForm(content);
            else if (view === 'preview') renderPreview(content);
            else renderBatch(content);
        }

        function collectCurrentForm(showError) {
            const child = getCurrentChild();
            if (!child) return false;

            ['name', 'gender', 'className'].forEach(field => {
                const el = document.querySelector(`#headerForm [data-field="${field}"]`);
                if (el) child.form.info[field] = el.value.trim();
            });

            dimensions.forEach(d => {
                const dim = child.form.dimensions.find(x => x.code === d.code);
                if (!dim) return;
                const fh = document.querySelector(`input[name="${d.code}_first"]:checked`);
                const sh = document.querySelector(`input[name="${d.code}_second"]:checked`);
                const note = document.querySelector(`textarea[name="${d.code}_note"]`);
                // 只有当表单元素存在时才更新，避免切换视图时无表单元素导致数据被清空
                if (fh) dim.firstHalf = fh.value;
                if (sh) dim.secondHalf = sh.value;
                if (note) dim.note = note.value.trim();
            });

            ['moments', 'focus', 'likes', 'goals'].forEach(key => {
                const el = document.querySelector(`#narrative_${key}`);
                if (el) child.form.narrative[key] = el.value.trim();
            });

            saveToStorage();

            if (showError) {
                const missing = getMissingFields(child);
                if (missing.length > 0) {
                    showToast('请补充以下必填项：' + missing.join('、'), 'error');
                    highlightMissing(missing);
                    return false;
                }
            }
            return true;
        }

        function getMissingFields(child) {
            const missing = [];
            const info = child.form.info;
            if (!info.name.trim()) missing.push('孩子姓名');
            if (!info.gender.trim()) missing.push('性别');
            if (!info.className.trim()) missing.push('班级名称');
            child.form.dimensions.forEach(d => {
                const dimInfo = dimensions.find(x => x.code === d.code);
                if (!d.firstHalf) missing.push(dimInfo.name + '（前半月）');
                if (!d.secondHalf) missing.push(dimInfo.name + '（后半月）');
            });
            return missing;
        }

        function highlightMissing(missing) {
            document.querySelectorAll('.form-control.error').forEach(el => el.classList.remove('error'));
            document.querySelectorAll('.radio-group.missing').forEach(el => el.classList.remove('missing'));
            document.querySelectorAll('tr.missing').forEach(el => el.classList.remove('missing'));

            if (missing.includes('孩子姓名')) {
                const el = document.querySelector('#headerForm [data-field="name"]');
                if (el) el.classList.add('error');
            }
            if (missing.includes('班级名称')) {
                const el = document.querySelector('#headerForm [data-field="className"]');
                if (el) el.classList.add('error');
            }
            if (missing.includes('性别')) {
                const el = document.querySelector('#headerForm [data-field="gender"]');
                if (el) el.classList.add('error');
            }

            dimensions.forEach(d => {
                const firstInput = document.querySelector(`input[name="${d.code}_first"]`);
                if (!firstInput) return;
                const row = firstInput.closest('tr');
                const firstMissing = missing.includes(d.name + '（前半月）');
                const secondMissing = missing.includes(d.name + '（后半月）');
                if (row && (firstMissing || secondMissing)) row.classList.add('missing');
                if (firstMissing) {
                    const rg = firstInput.closest('.radio-group');
                    if (rg) rg.classList.add('missing');
                }
                const secondInput = document.querySelector(`input[name="${d.code}_second"]`);
                if (secondMissing && secondInput) {
                    const rg = secondInput.closest('.radio-group');
                    if (rg) rg.classList.add('missing');
                }
            });
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(children));
                localStorage.setItem(STORAGE_DATE_KEY, formatDate());
            } catch (e) { console.warn('本地存储失败', e); }
        }

        function loadFromStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        children = parsed;
                        currentChildId = children[0].id;
                    }
                }
                const date = localStorage.getItem(STORAGE_DATE_KEY);
                if (date) submitDate = date;
            } catch (e) { console.warn('读取本地存储失败', e); }
        }

        function renderForm(container) {
            container.innerHTML = '';
            const child = getCurrentChild();
            if (!child) return;
            const info = child.form.info;

            const header = document.createElement('div');
            header.className = 'panel';
            header.innerHTML = `
                <div class="panel-title">📋 基本信息</div>
                <div class="header-form" id="headerForm">
                    <div class="form-group"><label>孩子姓名 <span class="required">*</span></label><input class="form-control" data-field="name" value="${escapeHtml(info.name)}" placeholder="请输入孩子姓名"></div>
                    <div class="form-group"><label>性别 <span class="required">*</span></label><select class="form-control" data-field="gender"><option value="" ${info.gender === '' ? 'selected' : ''}>请选择</option><option value="男" ${info.gender === '男' ? 'selected' : ''}>男</option><option value="女" ${info.gender === '女' ? 'selected' : ''}>女</option></select></div>
                    <div class="form-group"><label>班级名称 <span class="required">*</span></label><input class="form-control" data-field="className" value="${escapeHtml(info.className)}" placeholder="如：小一班"></div>
                </div>
            `;

            const dims = document.createElement('div');
            dims.className = 'panel';
            dims.innerHTML = `<div class="panel-title">📊 在园表现评估（10项必填，每项 A/B/C/D）</div>
                <table class="dimension-table">
                    <thead><tr><th style="width:18%">维度</th><th style="width:26%">前半月表现</th><th style="width:26%">后半月表现</th><th style="width:30%">典型表现 / 难忘瞬间（选填）</th></tr></thead>
                    <tbody>
                        ${dimensions.map(d => {
                            const dim = child.form.dimensions.find(x => x.code === d.code);
                            return `<tr>
                                <td><div class="dim-name">${d.code} ${d.name}</div><div class="dim-desc">${d.category}</div></td>
                                <td>${renderRadioGroup(d.code + '_first', d.options, dim.firstHalf)}</td>
                                <td>${renderRadioGroup(d.code + '_second', d.options, dim.secondHalf)}</td>
                                <td><textarea class="note-input" name="${d.code}_note" placeholder="可填写真实事例，未填写时系统将自动生成合理场景">${escapeHtml(dim.note)}</textarea></td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>`;

            const narrative = document.createElement('div');
            narrative.className = 'panel';
            narrative.innerHTML = `
                <div class="panel-title">✨ 个性化叙事（选填，用于让信件更生动）</div>
                <div class="narrative-grid">
                    <div class="narrative-item"><label>本月难忘的成长瞬间 / 进步事件 <span class="optional">选填</span></label><textarea class="note-input" id="narrative_moments" placeholder="如：9月10日第一次主动和小朋友分享玩具" style="min-height:80px">${escapeHtml(child.form.narrative.moments)}</textarea></div>
                    <div class="narrative-item"><label>需要家园重点关注的事项 <span class="optional">选填</span></label><textarea class="note-input" id="narrative_focus" placeholder="如：近期午睡入睡较慢，需要家园配合建立规律作息" style="min-height:80px">${escapeHtml(child.form.narrative.focus)}</textarea></div>
                    <div class="narrative-item"><label>孩子特别喜欢的活动 / 同伴 / 老师 <span class="optional">选填</span></label><textarea class="note-input" id="narrative_likes" placeholder="如：最喜欢玩沙水区，喜欢和乐乐一起玩" style="min-height:80px">${escapeHtml(child.form.narrative.likes)}</textarea></div>
                    <div class="narrative-item"><label>家庭中可配合强化的小目标 <span class="optional">选填</span></label><textarea class="note-input" id="narrative_goals" placeholder="如：在家练习自己穿脱外套" style="min-height:80px">${escapeHtml(child.form.narrative.goals)}</textarea></div>
                </div>
            `;

            const hint = document.createElement('div');
            hint.innerHTML = `<p class="help-text">💡 填写完成后可点击“信件预览”查看效果，确认无误后再到“批量生成”下载 Word 文档。典型表现框若未填写，系统会根据所选等级自动生成合理日常场景。</p><p class="help-text">数据会自动保存在浏览器本地，刷新页面不会丢失。</p>`;

            container.appendChild(header);
            container.appendChild(dims);
            container.appendChild(narrative);
            container.appendChild(hint);

            // 自动保存：任何输入变化后 500ms 自动收集并写入本地存储
            let autoSaveTimer = null;
            container.addEventListener('input', () => {
                if (autoSaveTimer) clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(() => collectCurrentForm(false), 500);
            });
        }

        function renderRadioGroup(name, options, selected) {
            return `<div class="radio-group">
                ${options.map(opt => {
                    const val = opt.charAt(0);
                    return `<label class="radio-label"><input type="radio" name="${name}" value="${val}" ${selected === val ? 'checked' : ''}><span class="radio-text">${opt}</span></label>`;
                }).join('')}
            </div>`;
        }

        function renderPreview(container) {
            const child = getCurrentChild();
            if (!child) return;
            const missing = getMissingFields(child);
            if (missing.length > 0) {
                container.innerHTML = `<div class="panel"><div class="panel-title">⚠️ 无法预览</div><p class="help-text error">当前孩子信息不完整，请先返回“填写调查表”补充以下必填项：</p><ul>${missing.map(m => `<li style="margin:6px 0;color:var(--warm-text);">${m}</li>`).join('')}</ul></div>`;
                return;
            }
            const letter = generateLetter(child);
            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.innerHTML = `<div class="panel-title">👁 信件预览（${escapeHtml(child.form.info.name || '未命名')}）</div><div class="toolbar"><span class="help-text">当前字数：${letter.length} 字</span></div><div class="letter-preview">${escapeHtml(letter)}</div>`;
            container.appendChild(panel);
        }

        function renderBatch(container) {
            const validChildren = children.filter(c => getMissingFields(c).length === 0);
            const incomplete = children.filter(c => !validChildren.includes(c));

            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.innerHTML = `
                <div class="panel-title">📦 生成全班家长反馈信 Word 文档</div>
                <p class="help-text">以下列表中“可生成”的孩子已填写完整 10 项维度。点击“一键生成”后，系统会把所有孩子的信件合并到一个 Word 文档中（每个孩子一页），您可以选择保存路径。</p>
                <div class="batch-list" style="margin: 16px 0;">
                    ${children.map(child => {
                        const info = child.form.info;
                        const ready = getMissingFields(child).length === 0;
                        return `<div class="batch-item"><div class="batch-info"><span style="font-weight:600;">${escapeHtml(info.name || '未命名')}</span><span style="font-size:12px;color:var(--warm-text-light);">${escapeHtml(info.className || '未填班级')}</span></div><span class="batch-status ${ready ? 'ready' : 'incomplete'}">${ready ? '可生成' : '信息不完整'}</span></div>`;
                    }).join('')}
                </div>
                <div style="display:flex;gap:12px;margin-top:20px;">
                    <button class="btn btn-primary" id="batchGenerate" ${validChildren.length === 0 ? 'disabled' : ''}>📥 一键生成 ${validChildren.length} 封信（合并 Word）</button>
                </div>
                ${incomplete.length > 0 ? `<p class="help-text" style="color:var(--warm-primary);margin-top:12px;">⚠️ 还有 ${incomplete.length} 个孩子信息不完整，请返回“填写调查表”补充完整。</p>` : ''}
            `;
            container.appendChild(panel);

            document.getElementById('batchGenerate').addEventListener('click', async () => {
                if (!collectCurrentForm(true)) return;
                const readyChildren = children.filter(c => getMissingFields(c).length === 0);
                if (readyChildren.length === 0) { showToast('没有可生成信件的孩子，请检查调查表是否填写完整。', 'error'); return; }
                await generateBatchDocs(readyChildren);
            });
        }

        function escapeHtml(text) { return text ? text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }

        function getScene(dimCode, level, name, gender, rand) {
            const lib = sceneLibrary[dimCode];
            if (!lib || !lib[level]) return '';
            const pool = Array.isArray(lib[level]) ? lib[level] : [lib[level]];
            const text = randomPick(pool, rand);
            return text.replace(/{name}/g, name).replace(/{gender}/g, gender);
        }

        function getDimensionNote(child, d, level, rand) {
            const dim = child.form.dimensions.find(x => x.code === d.code);
            const name = child.form.info.name || '孩子';
            const gender = child.form.info.gender === '女' ? '她' : '他';
            if (dim && dim.note.trim()) return dim.note.trim();
            return getScene(d.code, level, name, gender, rand);
        }

            const rand = seededRandom(childSeed(child));

            const dimMap = {};
            child.form.dimensions.forEach(d => { dimMap[d.code] = d.secondHalf || 'B'; });

            const highlightDims = dimensions.filter(d => { const lvl = dimMap[d.code]; return lvl === 'A' || lvl === 'B'; });
            const growthDims = dimensions.filter(d => { const lvl = dimMap[d.code]; return lvl === 'C' || lvl === 'D'; });

            // 打乱维度顺序，让相同等级组合的两个孩子也能呈现不同顺序
            const shuffledHighlightDims = shuffleWithSeed(highlightDims, rand);
            const shuffledGrowthDims = shuffleWithSeed(growthDims, rand);
            const selectedHighlights = pickWithNote(shuffledHighlightDims, child, 3);
            const selectedGrowths = pickWithNote(shuffledGrowthDims, child, 2);

            // 生成建议：从相关维度池中随机选，并保证不重复
            let suggestions = [];
            selectedGrowths.forEach(d => {
                const pool = suggestionsByCode[d.code] || [];
                if (pool.length) {
                    const text = randomPick(pool, rand);
                    if (!suggestions.includes(text)) suggestions.push(text);
                }
            });
            if (suggestions.length < 3) {
                const allSuggestions = [];
                dimensions.forEach(d => {
                    const pool = suggestionsByCode[d.code] || [];
                    pool.forEach(s => allSuggestions.push(s));
                });
                const shuffledSuggestions = shuffleWithSeed(allSuggestions, rand);
                for (const s of shuffledSuggestions) {
                    if (!suggestions.includes(s)) { suggestions.push(s); }
                    if (suggestions.length >= 3) break;
                }

                ],

                    name + '目前{name}还不太会表达如厕需求，老师需要定时带{gender}去洗手间',

                ] : [

                    name + '如厕习惯{name}还在建立，需要家园一起耐心配合'
                ],
                'C1': isD ? [

                    name + '和同伴在一起时{name}有时会用推搡或喊叫表达，需要老师及时引导',
                    name + '近期{name}在与同伴交往中容易出现冲突，老师会帮助{gender}学习正确方式'
                ] : [
                    name + '与同伴的互动还不够主动，老师会创造更多机会让' + gender + '加入游戏',
                    name + '{name}大多独自游戏，老师会邀请{gender}参与同伴活动',
                    name + '交往方面{name}还需要鼓励，老师会安排小朋友和{gender}一起游戏'
                ],
                'C2': isD ? [
                    name + '对老师的信任感还在建立中，目前对老师的靠近比较敏感',
                    name + '当老师靠近时{name}会紧张或回避，信任关系还需要时间',
                    name + '{name}对老师还比较防备，老师会每天温柔陪伴，慢慢建立安全感'
                ] : [
                    name + '与老师的亲密感还在建立中，表达需求时还偏含蓄',
                    name + '{name}在老师面前还比较害羞，不太主动表达需求',
                    name + '当老师主动关心时{name}能接受帮助，但还不太会主动靠近'
                ],
                'D1': isD ? [
                    name + '目前的口语表达还比较有限，老师会和家长一起持续关注' + gender + '的语言发展',
                    name + '{name}说话较少，很多需求还用动作或发音表达，需要持续关注',
                    name + '语言表达上{name}与同龄孩子相比还有差距，老师会多给{gender}开口机会'
                ] : [
                    name + '口语表达还比较简短，老师会多给' + gender + '表达的机会',
                    name + '{name}会用短词或动作表达，完整句子还需要多练习',
                    name + '老师每天都会和{name}多说说话，鼓励{gender}用语言表达自己的需要'
                ],
                'D2': isD ? [
                    name + '对指令的理解和反应还需要大量一对一辅助，老师会放慢语速、配合动作引导',
                    name + '当老师发出指令时{name}常常不理解，需要老师走到身边单独辅助',
                    name + '{name}对集体指令反应较弱，老师会配合动作、图示一对一引导'
                ] : [
                    name + '对集体指令的反应还需要时间和重复，老师会多用动作、图示辅助',
                    name + '{name}对简单指令能懂，复杂一点的需要老师多说几遍或做示范',
                    name + '听指令方面{name}还在发展中，老师会用更慢、更清楚的语言配合动作'
                ],
                'E1': isD ? [
                    name + '目前较难融入集体活动，会离开座位走动，老师会持续陪伴并慢慢引导',
                    name + '集体活动时{name}坐不住，常常离开座位，需要老师持续陪伴',
                    name + '在集体活动中{name}专注时间很短，容易被周围事物吸引，老师会逐步引导'
                ] : [
                    name + '集体活动中专注时间较短，老师会逐步帮助' + gender + '建立活动规则意识',
                    name + '{name}参加集体活动时容易分心，老师会多用游戏化方式吸引{gender}',
                    name + '集体活动方面{name}还需要适应，老师会逐步延长{gender}的专注时间'
                ],
                'E2': isD ? [
                    name + '规则意识和安全意识还在初步建立中，老师会时刻在身边提醒和保护',
                    name + '班级常规和安全规则{name}还不太理解，老师会时刻提醒并保护{gender}',
                    name + '近期{name}规则意识较弱，奔跑、推挤等情况需要老师重点关注'
                ] : [
                    name + '对班级常规和安全提示的记忆还需要不断强化',
                    name + '{name}对规则的理解还不稳定，常常需要老师提醒',
                    name + '常规方面{name}还在学习中，老师会通过重复和正向强化帮助{gender}记忆'
                ]
            };
            const pool = map[d.code] || [name + '在' + d.name + '方面还需要继续发展'];
            return randomPick(pool, rand).replace(/{name}/g, name).replace(/{gender}/g, gender);
        }

        function pickWithNote(dims, child, count) {
            const withNote = dims.filter(d => child.form.dimensions.find(x => x.code === d.code).note.trim());
            const withoutNote = dims.filter(d => !child.form.dimensions.find(x => x.code === d.code).note.trim());
            return [...withNote, ...withoutNote].slice(0, count);
        }

        function formatDate() {
            const now = new Date();
            return `${now.getFullYear()}年${String(now.getMonth() + 1).padStart(2, '0')}月${String(now.getDate()).padStart(2, '0')}日`;
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (type || '');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function generateBatchDocs(readyChildren) {
            const overlay = document.getElementById('progressOverlay');
            const fill = document.getElementById('progressFill');
            const text = document.getElementById('progressText');
            overlay.style.display = 'flex';

            submitDate = formatDate();
            saveToStorage();

            const fileName = (readyChildren[0].form.info.className || '班级') + '_入园首月家长反馈信.docx';

            // 修复①：先弹出保存路径选择框，再生成文档。
            // showSaveFilePicker 要求"瞬态用户激活"（点击后约 5 秒内有效），
            // 旧的"先生成后弹窗"流程在生成全班信件时容易超时，
            // 导致 SecurityError 被静默吞掉、保存路径选不上。
            let handle = null;
            if (window.showSaveFilePicker) {
                try {
                    handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{ description: 'Word 文档', accept: { 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'] } }]
                    });
                } catch (e) {
                    if (e.name === 'AbortError') {
                        showToast('已取消保存', 'error');
                        overlay.style.display = 'none';
                        return;
                    }
                    handle = null;
                    console.warn('showSaveFilePicker 打开失败，稍后将改用浏览器默认下载', e);
                }
            }

            try {
                const allChildren = [];
                for (let i = 0; i < readyChildren.length; i++) {
                    const child = readyChildren[i];
                    const letter = generateLetter(child);
                    allChildren.push({ child, letter });
                    fill.style.width = ((i + 1) / readyChildren.length * 100) + '%';
                    text.textContent = `${i + 1} / ${readyChildren.length}`;
                    await new Promise(r => setTimeout(r, 50));
                }

                fill.style.width = '100%';
                text.textContent = '生成 Word 文档中…';

                const buffer = await exportCombinedDocToBuffer(allChildren);
                if (!buffer || buffer.length === 0) throw new Error('Word 文档内容生成为空');

                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });

                if (handle) {
                    // 修复②：统一用 Blob 写入（浏览器兼容性最好的数据类型），
                    // 并在 close() 后回读文件大小校验，确保内容真实写入磁盘；
                    // 注意：保存框一确认，目标文件就会被立即创建/清空，
                    // 若写入失败而不校验，用户所选路径上就会留下一个空文件。
                    try {
                        let ok = false;
                        for (let attempt = 0; attempt < 2 && !ok; attempt++) {
                            const writable = await handle.createWritable();
                            await writable.write(blob);
                            await writable.close();
                            const saved = await handle.getFile();
                            ok = !!saved && saved.size === blob.size;
                        }
                        if (ok) {
                            showToast('文件已保存到所选路径', 'success');
                            return;
                        }
                        throw new Error('写入后校验失败');
                    } catch (e) {
                        console.warn('写入所选路径失败，改用浏览器默认下载', e);
                        showToast('所选路径写入未成功，已改用浏览器默认下载，请到下载目录查收', 'error');
                    }
                }

                saveAs(blob, fileName);
                showToast('已使用浏览器默认下载方式保存，请到浏览器下载目录查收', 'success');
            } catch (e) {
                console.error(e);
                showToast('生成失败：' + e.message, 'error');
            } finally {
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
            }
        }

        function letterTextToParagraphs(letterText, info, pageBreakBefore) {
            const lineSpacing = { line: 590, lineRule: 'exact' };
            const bodyRun = { font: '仿宋_GB2312', size: 32 };
            const paragraphs = [];

            paragraphs.push(new Paragraph({
                alignment: AlignmentType.CENTER,
                pageBreakBefore: !!pageBreakBefore,
                spacing: { ...lineSpacing, after: 200 },
                children: [new TextRun({ text: '关于' + info.name + '入园首月成长情况的反馈', font: '方正小标宋简体', size: 44, bold: true })]
            }));

            paragraphs.push(new Paragraph({
                alignment: AlignmentType.LEFT,
                spacing: { ...lineSpacing, before: 200, after: 100 },
                children: [new TextRun({ text: '亲爱的家长朋友：', ...bodyRun })]
            }));

            const lines = letterText.split('\n').filter(l => l.trim() !== '');
            let firstPara = true;
            lines.forEach(line => {
                if (line.startsWith('亲爱的') || /老师$/.test(line) || /^\d{4}年\d{2}月\d{2}日/.test(line)) return;
                if (line.trim() === '') return;

                if (/^\d+\./.test(line)) {
                    paragraphs.push(new Paragraph({
                        alignment: AlignmentType.JUSTIFIED,
                        spacing: { ...lineSpacing, before: 60, after: 60 },
                        indent: { firstLine: 640 },
                        children: [new TextRun({ text: line, ...bodyRun })]
                    }));
                } else {
                    paragraphs.push(new Paragraph({
                        alignment: AlignmentType.JUSTIFIED,
                        spacing: { ...lineSpacing, before: firstPara ? 0 : 100, after: 100 },
                        indent: { firstLine: 640 },
                        children: [new TextRun({ text: line, ...bodyRun })]
                    }));
                    firstPara = false;
                }
            });

            const signText = (info.className ? info.className : '') + '老师';
            paragraphs.push(new Paragraph({
                alignment: AlignmentType.RIGHT,
                spacing: { ...lineSpacing, before: 300, after: 0 },
                children: [new TextRun({ text: signText, ...bodyRun })]
            }));
            paragraphs.push(new Paragraph({
                alignment: AlignmentType.RIGHT,
                spacing: { ...lineSpacing, before: 60, after: 0 },
                children: [new TextRun({ text: submitDate, ...bodyRun })]
            }));

            return paragraphs;
        }

        async function exportCombinedDocToBuffer(childrenLetters) {
            const allParagraphs = [];
            childrenLetters.forEach((item, index) => {
                // 从第二个孩子起，标题段落设置"段前分页"，实现每个孩子信件另起一页
                const paragraphs = letterTextToParagraphs(item.letter, item.child.form.info, index > 0);
                allParagraphs.push(...paragraphs);
            });

            const doc = new Document({
                sections: [{
                    properties: {
                        page: {
                            margin: {
                                top: convertInchesToTwip(1.4567),
                                bottom: convertInchesToTwip(1.3779),
                                left: convertInchesToTwip(1.1024),
                                right: convertInchesToTwip(1.0236)
                            }
                        }
                    },
                    children: allParagraphs
                }]
            });

            const blob = await Packer.toBlob(doc);
            if (blob.arrayBuffer) {
                const arrayBuffer = await blob.arrayBuffer();
                return new Uint8Array(arrayBuffer);
            }
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(new Uint8Array(reader.result));
                reader.onerror = reject;
                reader.readAsArrayBuffer(blob);
            });
        }

        init();
    </script>
